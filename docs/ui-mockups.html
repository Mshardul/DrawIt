<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrawIt UI mockups</title>
<!-- Layout reference for every screen and state. Behaviour is in the spec and decisions; this file shows how it looks.
     Every visual value lives in ui-mockups/tokens.css; ui-mockups/styles.css holds rules only. Open straight from disk. -->
<link rel="stylesheet" href="ui-mockups/tokens.css">
<link rel="stylesheet" href="ui-mockups/styles.css">
</head>
<body>
<div class="ctl" id="ctl"></div>
<div class="note" id="note"></div>
<div class="win" id="win"></div>
<script>
const TH=[
 {r:[[10,12,34,22],[76,12,34,22],[43,50,34,22]],l:[[44,23,76,23],[27,34,55,50],[93,34,65,50]]},
 {r:[[8,28,28,20],[46,10,28,20],[46,44,28,20],[84,28,28,20]],l:[[36,38,46,20],[36,38,46,54],[74,20,84,36],[74,54,84,40]]},
 {r:[[8,8,44,18],[68,8,44,18],[8,50,44,18],[68,50,44,18]],l:[[52,17,68,17],[30,26,30,50],[90,26,90,50],[52,59,68,59]]},
 {r:[[44,6,32,16],[10,34,32,16],[78,34,32,16],[44,58,32,14]],l:[[60,22,26,34],[60,22,94,34],[26,50,54,58],[94,50,66,58]]}];
const thumb=(i,cls='')=>{const d=TH[i%4];return `<svg class="thumb ${cls}" viewBox="0 0 120 76">${d.r.map(a=>`<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" rx="3"/>`).join('')}${d.l.map(a=>`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}"/>`).join('')}</svg>`};
const icon=(cls,vb,p)=>`<svg class="ic ${cls}" viewBox="${vb}">${p}</svg>`;
const fo=()=>icon('ic-sm ic-muted','0 0 18 18','<path d="M2 5h5l1.5 2H16v8H2z"/>');
const fi=(cls='ic-md')=>icon(cls+' ic-muted','0 0 18 18','<path d="M4 2h7l3 3v11H4z"/><path d="M11 2v3h3"/>');
const UI={undo:'<path d="M7 5L3.5 8.5 7 12M4 8.5h8a4 4 0 010 8h-2"/>',redo:'<path d="M13 5l3.5 3.5L13 12M16 8.5H8a4 4 0 000 8h2"/>',home:'<path d="M3.5 9L10 3.5 16.5 9M5.5 8v8h9V8"/>',grid:'<path d="M4 4h12v12H4zM8 4v12M12 4v12M4 8h12M4 12h12"/>',snap:'<path d="M5 4v6a5 5 0 0010 0V4M5 7h3M12 7h3"/>'};
const ui=n=>icon('ic-sm','0 0 20 20',UI[n]);
const btn=(t,c='')=>`<button class="btn ${c}">${t}</button>`;
const bar=(r='')=>`<div class="bar"><h1>DrawIt</h1><span class="sp"></span>${r}</div>`;
const nav=btn('Import')+btn('Open folder…');
const crumbsHtml=a=>a.map((x,i)=>i==a.length-1?`<b>${x}</b>`:`${x} ›`).join(' ');
const pcard=(n,c,m,t)=>`<div class="card"><div class="th">${thumb(t)}</div><div class="cm"><b>${n}</b><span class="mnu">⋯</span></div><div class="muted small">${c} diagrams · ${m}</div></div>`;
const dcard=(n,m,t,o={})=>`<div class="card">${o.menu?'<div class="menu"><div>Rename</div><div>Move to project…</div><div class="d">Delete</div></div>':''}<div class="th ${o.k=='load'||o.k=='bad'?o.k:''}" ${o.k=='bad'?'title="line 12, column 5: unexpected end of node"':''}>${o.k=='load'?'<span class="muted small">Drawing…</span>':o.k=='bad'?fi()+'<span class="small msg">Can\'t open this file</span>':o.k=='big'?fi()+'<span class="small muted">Too large to preview</span>':thumb(t)}</div><div class="cm"><b>${n}</b>${o.nomenu?'':`<span class="mnu ${o.menu?'on':''}">⋯</span>`}</div><div class="muted small">${m}</div></div>`;
const dlg=(t,body,foot,size='sheet-sm',under='')=>under+`<div class="scrim"><div class="sheet ${size}"><div class="hd">${t}</div><div class="bd">${body}</div><div class="ft">${foot}</div></div></div>`;
const home=(under)=>bar(nav)+`<div class="body"><div class="page"><div class="head"><h2>Projects</h2>${btn('New diagram')}${btn('New project','primary')}</div><div class="grid">${pcard('Home network',5,'Today',0)}${pcard('Client pitch',2,'Yesterday',1)}${pcard('Payments platform',7,'Mon',2)}${pcard('Drafts',2,'Today',3)}<div class="card add">+ New project</div></div><h3 class="sec">Recent</h3><div class="grid">${dcard('network','Home network',0,{nomenu:1})}${dcard('checkout-flow','Payments platform',2,{nomenu:1})}${dcard('pitch-arch','Client pitch',1,{nomenu:1})}${dcard('Untitled 2','Drafts',3,{nomenu:1})}</div></div>${under||''}</div>`;
const opt=(on,t)=>`<div class="opt"><span class="radio ${on?'on':''}"></span><span>${t}</span></div>`;
const cb=(on,t)=>`<div class="opt"><span class="chk ${on?'on':''}"></span><span>${t}</span></div>`;
const seg=(a,on)=>`<span class="seg">${a.map((x,i)=>`<span class="${i==on?'on':''}">${x}</span>`).join('')}</span>`;

/* editor pieces */
const SH={rect:'<rect x="4" y="5" width="26" height="16" rx="1"/>',ellipse:'<ellipse cx="17" cy="13" rx="13" ry="9"/>',rounded:'<rect x="4" y="5" width="26" height="16" rx="6"/>',diamond:'<path d="M17 2l13 11-13 11L4 13z"/>',triangle:'<path d="M17 3l13 20H4z"/>',hexagon:'<path d="M9 3h16l7 10-7 10H9L2 13z"/>',star:'<path d="M17 2l4 8 9 1-6.5 6 2 8.5L17 21l-7.5 4.5 2-8.5L5 11l9-1z"/>',callout:'<path d="M4 4h26v14H16l-5 5v-5H4z"/>',process:'<rect x="3" y="6" width="28" height="14"/><path d="M8 6v14M26 6v14"/>',decision:'<path d="M17 2l14 11-14 11L3 13z"/>',terminator:'<rect x="3" y="6" width="28" height="14" rx="7"/>',data:'<path d="M9 5h22l-6 16H3z"/>',document:'<path d="M4 4h26v15c-5-3-9 3-13 0s-9 3-13 0z"/>',arrow:'<path d="M3 9h16V4l12 9-12 9v-5H3z"/>',server:'<rect x="5" y="3" width="24" height="8" rx="1"/><rect x="5" y="14" width="24" height="8" rx="1"/><circle cx="10" cy="7" r=".8"/><circle cx="10" cy="18" r=".8"/>',database:'<ellipse cx="17" cy="6" rx="10" ry="3.5"/><path d="M7 6v14c0 2 4.5 3.5 10 3.5s10-1.5 10-3.5V6"/><path d="M7 13c0 2 4.5 3.5 10 3.5s10-1.5 10-3.5"/>',cloud:'<path d="M9 21a5 5 0 010-10 7 7 0 0113-2 6 6 0 013 12z"/>',user:'<circle cx="17" cy="8" r="4"/><path d="M8 23c0-6 4-9 9-9s9 3 9 9z"/>',browser:'<rect x="3" y="4" width="28" height="18" rx="2"/><path d="M3 9h28"/><circle cx="7" cy="6.5" r=".7"/>',router:'<rect x="3" y="12" width="28" height="9" rx="2"/><path d="M10 12V6M17 12V4M24 12V6"/>',container:'<rect x="4" y="4" width="26" height="18"/><rect x="10" y="9" width="14" height="8"/>',select:'<path d="M10 4l14 9-6 1.5L15 21z"/>',hand:'<path d="M10 14V8a1.5 1.5 0 013 0v4V6a1.5 1.5 0 013 0v6V7a1.5 1.5 0 013 0v6V10a1.5 1.5 0 013 0v6c0 4-3 6-7 6s-6-2-8-5l-2-3a1.5 1.5 0 012.5-1.5z"/>',line:'<path d="M5 21L29 5"/>',arrowl:'<path d="M5 21L29 5M29 5h-7M29 5v7"/>',text:'<path d="M9 5h16M17 5v17"/>',frame:'<path d="M10 3v20M24 3v20M3 9h28M3 17h28"/>',image:'<rect x="4" y="4" width="26" height="18" rx="2"/><circle cx="11" cy="10" r="2"/><path d="M5 20l7-6 5 4 4-3 8 5"/>'};
const tile=k=>`<div class="tile">${icon('ic-tile','0 0 34 26',SH[k])}</div>`;
const group=(h,keys)=>`<h4>${h}</h4><div class="tiles">${keys.map(tile).join('')}</div>`;
const T=n=>`<span class="t">${ui(n)}</span>`;
const lib=o=>`<div class="lib ${o.libWide?'wide':''} ${o.min?'min':''}"><div class="in"><input placeholder="Search shapes">${group('Basic',['rect','ellipse','rounded','diamond','triangle','hexagon','star','callout'])}${group('Flowchart',['process','decision','terminator','data','document','arrow'])}${group('Architecture',['server','database','cloud','user','browser','router','container'])}</div><div class="resizer ${o.drag=='lib'?'on':''}"></div>${o.drag=='lib'?'<span class="hint hint-edge">Library 300 px (180 to 360)</span>':''}</div>`;
const sty=o=>`<div class="sty ${o.min?'min':''}"><div class="in"><div class="f1"><i>Fill</i><b>none</b></div><div class="f1"><i>Stroke</i><b>#1a1a1a</b></div><div class="f1"><i>Width</i><b>1.5</b></div><div class="f1"><i>Opacity</i><b>1</b></div></div><div class="resizer"></div></div>`;
const filePill=state=>`<div class="pill at-tr"><span class="t">${ui('home')}</span><span class="txt compact"><b>network</b></span><span class="txt compact small ${state.startsWith('Not')?'action':'muted'}">${state}</span><span class="sep"></span>${T('undo')}${T('redo')}<span class="sep"></span>${btn('Export','pill-btn')}</div>`;
const statusPill=mode=>mode=='none'?'':`<div class="pill at-tl"><span class="t narrow">−</span><span class="txt compact small">100%</span><span class="t narrow">+</span>${mode=='full'?'<span class="sep"></span><span class="txt compact small muted">412, 188</span>':''}<span class="sep"></span><span class="t icon on">${ui('grid')}</span><span class="t icon on">${ui('snap')}</span></div>`;
const tbTools=['select','hand','rect','ellipse','line','arrowl','text','frame','image'];
const toolbar=(pos,grab)=>`<div class="pill ${pos}"><span class="grip ${grab?'on':''}"></span><span class="sep"></span>${tbTools.map((k,i)=>`<span class="t ${i==0?'on':''}">${icon('ic-tool','0 0 34 26',SH[k])}</span>${i==1||i==3||i==5?'<span class="sep"></span>':''}`).join('')}</div>`;
const diagram=`<svg class="d" viewBox="0 0 700 520" preserveAspectRatio="xMidYMid slice"><rect class="d-shape" x="120" y="150" width="140" height="64" rx="6"/><rect class="d-shape" x="380" y="120" width="140" height="64" rx="6"/><rect class="d-shape" x="260" y="300" width="140" height="64" rx="6"/><line class="d-line" x1="260" y1="182" x2="380" y2="152"/><line class="d-line" x1="330" y1="300" x2="440" y2="184"/><text class="d-text" x="160" y="187">Router</text><text class="d-text" x="420" y="157">Switch</text><text class="d-text" x="300" y="337">NAS</text></svg>`;
const editor=(o={})=>[(o.noPanels?'':lib(o)),`<div class="cv">${diagram}${filePill(o.state||'✓ Saved')}${statusPill(o.status||'full')}${o.noToolbar?'':toolbar(o.tb||'at-bc',o.grab)}${o.extra||''}</div>`,(o.noPanels?'':sty(o))].join('');
const exportDlg=(scale,err)=>dlg('Export',`<div class="export"><div class="opts"><div class="muted small">What</div>${opt(1,'Whole canvas')}${opt(0,'Selection')}${opt(0,'Frame: Overview')}<div class="muted small mt-md">Format</div>${seg(['SVG','PNG'],1)}<div class="muted small mt-md">Scale</div>${seg(['1x','2x','3x'],scale)}${cb(1,'Transparent background')}</div><div class="side"><div class="pv">${thumb(0,'thumb-preview')}</div><div class="muted small mt-md">${err?'PNG at 3x: 24,000 × 18,000 px':'PNG at 2x: 1624 × 1080 px'}</div>${err?`<div class="err mt-md">Too large for the browser to draw. Use a smaller scale, or export a frame.</div>`:''}</div></div>`,`<span class="muted small">${err?'':'network.png'}</span><span class="sp"></span>${btn('Cancel')}<button class="btn primary" ${err?'disabled':''}>Download</button>`,'sheet-xl',editor());
const prefs=(tab,body)=>dlg('Preferences',`<div class="bleed prefs"><div class="nav"><div class="ptab ${tab==0?'on':''}">General</div><div class="ptab ${tab==1?'on':''}">Shortcuts</div></div><div class="pbody">${body}</div></div>`,`${tab==1?btn('Reset all','link'):''}<span class="sp"></span>${btn('Done','primary')}`,'sheet-xl',editor());
const krow=(a,k,bad,noReset)=>`<div class="kr"><span class="sp">${a}</span><span class="k ${bad?'bad':''}">${k}</span>${noReset?'<span class="reset"></span>':'<span class="reset">Reset</span>'}</div>`;
const pal=(i,a,k)=>`<div class="pi ${i==0?'sel':''}"><span>${a}</span><span class="sp"></span>${k?`<span class="kbd">${k}</span>`:''}</div>`;

/* groups: [label, [ [name, note, render, editor, windowClass] ]] */
const G=[
 ['Home',[
  ['First run','Nothing exists yet. The four ways in are offered and the screen says where files live (E52). No empty grid.',()=>bar(nav)+`<div class="body"><div class="center"><h2>Draw your first diagram</h2><div class="muted">Your projects are saved in <b>~/DrawIt</b> as plain text files.</div><div class="acts">${btn('New diagram','primary')}${btn('New project')}${btn('Open folder…')}${btn('Import a file')}</div></div></div>`],
  ['Projects','Start screen. One card per project, showing its most recently changed diagram (E57). Recent diagrams below are the library\'s (E46). The card menu offers rename and delete (E54, E59).',()=>home()],
  ['Project','Landing page of a project. First card: menu open. Second: still drawing. Fourth: a file that does not parse, with its position on hover (E58). The card hover is a tooltip. Fifth: too large to preview.',()=>bar(nav)+`<div class="body"><div class="page"><div class="head"><span class="muted">‹ Home</span><h2 class="after-back">Home network</h2>${btn('Rename')}${btn('Import here')}${btn('New diagram','primary')}</div><div class="grid">${dcard('network','Today 10:42',0,{menu:1})}${dcard('vlans','Yesterday',1,{k:'load'})}${dcard('wifi-plan','Mon',2)}${dcard('broken','Mon',2,{k:'bad'})}${dcard('rack-photo-wall','Last week',3,{k:'big'})}<div class="card add">+ New diagram</div></div></div></div>`],
  ['Opened folder','A folder outside the library, such as a repo. Same cards; a path header and a tag; no card menus, since rename and delete are left to the operating system (E54). Only the top level is listed (E45). Recent files are those of this folder (E46).',()=>bar(nav)+`<div class="body"><div class="page"><div class="head"><span class="muted">‹ Home</span><h2 class="after-back">docs</h2><span class="tag">Opened folder</span><span class="path muted small">~/Documents/repos/my-app/docs</span><span class="sp"></span>${btn('Open folder…')}${btn('New diagram','primary')}</div><div class="grid">${dcard('architecture','Today',3,{nomenu:1})}${dcard('deploy','Yesterday',1,{nomenu:1})}${dcard('data-flow','Mon',0,{nomenu:1})}<div class="card add">+ New diagram</div></div><h3 class="sec">Recent in this folder</h3><div class="grid">${dcard('architecture','Today',3,{nomenu:1})}${dcard('deploy','Yesterday',1,{nomenu:1})}</div></div></div>`],
  ['Drafts','New diagrams start in the Drafts project (E53). Its card menu offers Move to project, as every library diagram\'s does. Autosave is on in the library (E51).',()=>bar(nav)+`<div class="body"><div class="page"><div class="head"><span class="muted">‹ Home</span><h2 class="after-back">Drafts</h2><span class="tag">Autosaved</span><span class="sp"></span>${btn('New diagram','primary')}</div><div class="grid">${dcard('Untitled 2','Today 11:05',3,{menu:1})}${dcard('Untitled','Today 09:12',1)}<div class="card add">+ New diagram</div></div></div></div>`]
 ]],
 ['Dialogs',[
  ['New project','Names use letters, numbers, spaces, hyphens and underscores. A name that exists, ignoring case, is refused (E76).',()=>dlg('New project',`<input class="f bad" value="home Network"><div class="err">A project named "Home network" already exists.</div>`,`<span class="sp"></span>${btn('Cancel')}<button class="btn primary" disabled>Create</button>`,'sheet-sm',home())],
  ['Delete','The confirmation names what goes and where it goes. The item moves to the operating system\'s trash (E54).',()=>dlg('Delete "Client pitch"?',`<div>This project and its 2 diagrams move to the Trash.</div>`,`<span class="sp"></span>${btn('Cancel')}${btn('Move to Trash','danger')}`,'sheet-sm',home())],
  ['Delete, no trash','Where there is no trash, the second confirmation says the delete is permanent.',()=>dlg('Delete "Client pitch" permanently?',`<div>This cannot be undone. The project and its 2 diagrams will be removed from the disk.</div>`,`<span class="sp"></span>${btn('Cancel')}${btn('Delete permanently','danger')}`,'sheet-sm',home())],
  ['Import','Choose a file from the computer; it is copied into the chosen project (E55).',()=>dlg('Import a diagram',`<div class="drop">Drop a .drawit.kdl file here<br><span class="small">or</span><br>${btn('Choose file…')}</div><div><span class="small muted">Into project</span><br><select class="f"><option>Home network</option></select></div>`,`<span class="sp"></span>${btn('Cancel')}<button class="btn primary" disabled>Import</button>`,'sheet-md',home())],
  ['Import refused','A file that fails to parse is refused with its line and column.',()=>dlg('Import a diagram',`<div class="drop bad">pitch.drawit.kdl</div><div class="err">Can't import: line 12, column 5: unexpected end of node.</div>`,`<span class="sp"></span>${btn('Cancel')}<button class="btn primary" disabled>Import</button>`,'sheet-md',home())],
  ['New diagram','From a project or a folder the author gives a name; .drawit.kdl is added and a name that exists in the folder is refused (E74). From the start screen a draft is created without asking (E53).',()=>dlg('New diagram',`<input class="f bad" value="network"><div class="err">network.drawit.kdl already exists in Home network.</div>`,`<span class="sp"></span>${btn('Cancel')}<button class="btn primary" disabled>Create</button>`,'sheet-sm',home())],
  ['Rename','Rename is the same dialog for a project and a diagram in the library; the extension is added (E54).',()=>dlg('Rename diagram',`<input class="f" value="vlans"><div class="muted small">Saved as vlans.drawit.kdl</div>`,`<span class="sp"></span>${btn('Cancel')}${btn('Rename','primary')}`,'sheet-sm',home())],
  ['Move to project','Moves a draft into a project. New project creates one on the way (E53).',()=>dlg('Move "Untitled 2" to a project',`${opt(1,'Home network')}${opt(0,'Client pitch')}${opt(0,'Payments platform')}<div class="accent pad-row-sm">+ New project</div>`,`<span class="sp"></span>${btn('Cancel')}${btn('Move','primary')}`,'sheet-sm',home())],
  ['Unsaved work','Closing the file or switching folder with unsaved edits offers Save, Discard or Cancel (E75). It shows over the editor in an opened folder, where autosave is off (E51).',()=>dlg('Save changes to "architecture"?',`<div>Your edits since the last save are lost if you discard them.</div>`,`${btn('Discard','danger')}<span class="sp"></span>${btn('Cancel')}${btn('Save','primary')}`,'sheet-md',editor({state:'Not saved'})),1],
  ['Folder browser','A list with a breadcrumb (E60). It lists folders and .drawit.kdl files, starting at the home directory. Picking a folder opens its landing page; picking a file opens that file with its folder as the workspace (E47).',()=>dlg('Open a folder or a file',`<div class="bleed"><div class="crumbs">${crumbsHtml(['Home','Documents','repos','my-app','docs'])}<span class="sp"></span>${btn('New folder','link')}</div></div><div class="browser-list"><div class="row sel">${fo()}<b>diagrams</b><span class="sp"></span><span class="muted">›</span></div><div class="row">${fo()}<span>adr</span><span class="sp"></span><span class="muted">›</span></div><div class="row">${fo()}<span>images</span><span class="sp"></span><span class="muted">›</span></div><div class="row">${fi('ic-sm')}<span>architecture.drawit.kdl</span></div><div class="row">${fi('ic-sm')}<span>deploy.drawit.kdl</span></div></div>`,`<span class="muted small">Selected: diagrams</span><span class="sp"></span>${btn('Cancel')}${btn('Open folder','primary')}`,'sheet-lg',home())]
 ]],
 ['Editor',[
  ['Editor','Both panels are open by default (E63). The toolbar floats at the bottom centre (E61); the library panel holds shapes only, as tiles with the name on hover (E62). The file pill at the top right is the only control that always shows (E64), and the status pill sits at the top left (E80). The save state reads Saving, Saved, or Not saved, and clicking Not saved saves (E86).',()=>editor(),1],
  ['Toolbar moved','A grip at the left end of the toolbar moves it anywhere inside the canvas; a double-click on the grip returns it to the bottom centre (E77). Its position is kept in the preferences file (A32).',()=>editor({tb:'at-moved',grab:1,extra:'<span class="hint hint-moved">Double-click to reset</span>'}),1],
  ['Panel resize','The edge of each panel drags to resize it, between 180 and 360 px, and never leaves the canvas under 480 px (E81). The edge highlights while it is dragged, and a double-click on it restores the default width.',()=>editor({libWide:1,drag:'lib'}),1],
  ['Narrow canvas','When the status pill and the file pill do not fit on one row with a gap, the status pill drops the cursor position (E82). Shown with a 1000 px window and both panels open.',()=>editor({status:'compact'}),1,'win-narrow'],
  ['Very narrow canvas','When even the short form does not fit, the status pill is hidden, since the zoom shortcuts still work (E82). The panels have shrunk to their minimum width before the canvas did (E83). Shown with a 780 px window.',()=>editor({status:'none',min:1}),1,'win-narrower'],
  ['Panels hidden','Each panel can be hidden. The toolbar, the file pill and the status pill stay, so Home, undo, redo and Export are still reachable (E64).',()=>editor({noPanels:1}),1],
  ['Another tab','Shown in a second tab on the same server. Use here takes the session over (A29).',()=>`<div class="body"><div class="center"><h2>DrawIt is open in another tab</h2><div class="muted">Only one tab can edit at a time, so nothing gets written to the wrong place.</div><div class="acts">${btn('Use here','primary')}</div></div></div>`],
  ['Changed on disk','Autosave found the file changed since it was read. It does not write until the author answers (E3).',()=>editor({state:'Not saved',extra:`<div class="notice"><span><b>network.drawit.kdl changed on disk.</b> Keep your edits and overwrite it, or reload and lose your edits.</span><span class="sp"></span>${btn('Reload')}${btn('Keep my edits','primary')}</div>`}),1],
  ['Export','The dialog offers the canvas, the selection or a frame, as SVG or PNG; a PNG has a scale and an optional transparent background. Download saves an ordinary file named after the diagram (E48, E50). The preview is the export at its own size, not the canvas view (E49).',()=>exportDlg(1,0),1],
  ['Export too large','A PNG larger than the browser can draw is refused with a message, and Download stays off (E69).',()=>exportDlg(2,1),1],
  ['Preferences','View toggles and saving. Panels, the toolbar and the status pill can be hidden here or from View; the file pill cannot (E63, E64, E79). Autosave is a preference with a default for the library and one for opened folders (E51).',()=>prefs(0,`<b>View</b>${cb(1,'Library panel')}${cb(1,'Properties panel')}${cb(1,'Toolbar')}${cb(1,'Status pill')}<b class="mt-lg">Canvas</b>${cb(1,'Show grid')}${cb(1,'Snap to grid')}<b class="mt-lg">Autosave</b>${cb(1,'In the library')}${cb(0,'In opened folders')}`),1],

const flat=[];G.forEach((g,gi)=>g[1].forEach((s,si)=>flat.push({g:gi,s:si,d:s})));
let i=Math.min(flat.length-1,Math.max(0,+(location.hash.slice(1)||0)));
function draw(){
 const ctl=document.getElementById('ctl');let n=0;
 ctl.innerHTML=G.map(g=>`<div class="g"><span class="lab">${g[0]}</span>${g[1].map(s=>{const k=n++;return `<button aria-pressed="${k==i}" data-i="${k}">${s[0]}</button>`}).join('')}</div>`).join('');
 const d=flat[i].d;
 document.getElementById('note').innerHTML='<b>'+d[0]+'.</b> '+d[1];
 const w=document.getElementById('win');w.className='win'+(d[3]?' ed':'')+(d[4]?' '+d[4]:'');w.innerHTML=d[2]();
 try{history.replaceState(null,'','#'+i)}catch(e){}
}
document.addEventListener('click',e=>{const b=e.target.closest('.ctl button');if(b){i=+b.dataset.i;draw()}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&i<flat.length-1){i++;draw()}if(e.key==='ArrowLeft'&&i>0){i--;draw()}});
draw();
</script></body></html>
