<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrawIt UI mockups</title>
<!-- Layout reference for every screen and state. Behaviour is in the spec and decisions; this file shows how it looks. Open it straight from disk. -->
<style>
:root{--text:#1a1a1a;--muted:#555;--line:#ccc;--soft:#f3f3f3;--accent:#1a73e8;--tint:#dbe8f5;--warn:#a35200;--err:#7a1010;--errbg:#fde8e8}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;color:var(--text);background:#e4e4e4}
.ctl{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 22px}
.ctl .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl .lab{font-size:11px;text-transform:uppercase;color:var(--muted);margin-right:2px}
.ctl button{font:inherit;padding:4px 10px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--tint);border-color:var(--accent)}
.note{padding:10px 16px;font-size:13px;color:var(--muted);max-width:1000px;line-height:1.45}.note b{color:var(--text)}
.win{width:1000px;max-width:calc(100% - 32px);height:600px;margin:0 16px 24px;background:#fff;border:1px solid #aaa;border-radius:6px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.win.ed{flex-direction:row}
.bar{display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line);flex:none}
.bar h1{font-size:16px;margin:0}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{font:inherit;padding:4px 10px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:#b00020;border-color:#b00020;color:#fff}
.btn.link{border-color:transparent;color:var(--accent);padding:4px 6px}
.btn[disabled]{opacity:.45}
.body{flex:1;min-height:0;display:flex;position:relative}
.page{flex:1;overflow:hidden;padding:24px 32px}
.head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.head h2{margin:0 auto 0 0;font-size:18px}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;position:relative}
.card:hover{border-color:var(--accent)}
.card .th{background:var(--soft);border-radius:4px;height:92px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;flex-direction:column;gap:4px;overflow:hidden}
.card .cm{display:flex;align-items:center;gap:4px}
.card .cm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnu{margin-left:auto;color:var(--muted);padding:0 6px;border-radius:3px}
.mnu.on{background:var(--tint);color:var(--text)}
.card.add{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--accent);min-height:140px}
.th.load{background:linear-gradient(90deg,#f3f3f3,#e6e6e6,#f3f3f3)}
.th.bad{background:var(--errbg);color:var(--err)}
.menu{position:absolute;right:6px;top:136px;width:170px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:4px;z-index:8}
.menu div{padding:6px 10px;border-radius:4px}.menu div:hover{background:var(--soft)}.menu .d{color:#b00020}
.tag{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:5}
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.sheet .hd{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.sheet .bd{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sheet .ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
input.f,select.f{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;width:100%;background:#fff}
input.f.bad{border-color:#b00020;outline:1px solid #b00020}
.err{color:#b00020;font-size:12px}
.drop{border:1.5px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:4px}
.row.sel{background:var(--tint)}
.crumbs{display:flex;gap:4px;align-items:center;padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.crumbs b{color:var(--text)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.center h2{margin:0;font-size:20px}
.acts{display:flex;gap:8px;margin-top:8px}
/* editor */
.lib{width:224px;border-right:1px solid var(--line);flex:none;font-size:12px}
.lib .in,.sty .in{padding:8px 10px;overflow:hidden}
.lib input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px}
.lib h4{margin:10px 0 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tile{height:44px;border:1px solid transparent;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.tile:hover{background:var(--soft)}
.tile.on{background:var(--tint);border-color:var(--accent)}
.tip{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap;z-index:9}
.sty{width:200px;border-left:1px solid var(--line);flex:none;font-size:12px}
.sty .in{padding:8px 12px}
.f1{margin-bottom:8px}.f1 i{display:block;font-style:normal;color:var(--muted);margin-bottom:2px}
.f1 b{display:block;border:1px solid var(--line);border-radius:3px;padding:3px 6px;font-weight:400}
.cv{flex:1;position:relative;min-width:0;background-image:radial-gradient(#d8d8d8 1.2px,transparent 1.2px);background-size:20px 20px}
.cv svg.d{position:absolute;inset:0}
.pill{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:3px;display:flex;align-items:center;gap:2px;white-space:nowrap}
.t{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:5px;cursor:pointer}
.t:hover{background:var(--soft)}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.txt{padding:0 8px;display:flex;align-items:center;gap:6px;height:30px}
.txt b{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{width:12px;height:12px;border:1px solid var(--muted);border-radius:2px;display:inline-block;margin-right:3px;vertical-align:-2px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.notice{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:520px;background:#fff4e5;border:1px solid #e8c48b;color:var(--warn);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:6}
</style></head>
<body>
<div class="ctl" id="ctl"></div>
<div class="note" id="note"></div>
<div class="win" id="win"></div>
<script>
const TH=[
 {r:[[10,12,34,22],[76,12,34,22],[43,50,34,22]],l:[[44,23,76,23],[27,34,55,50],[93,34,65,50]]},
 {r:[[8,28,28,20],[46,10,28,20],[46,44,28,20],[84,28,28,20]],l:[[36,38,46,20],[36,38,46,54],[74,20,84,36],[74,54,84,40]]},
 {r:[[8,8,44,18],[68,8,44,18],[8,50,44,18],[68,50,44,18]],l:[[52,17,68,17],[30,26,30,50],[90,26,90,50],[52,59,68,59]]},
 {r:[[44,6,32,16],[10,34,32,16],[78,34,32,16],[44,58,32,14]],l:[[60,22,26,34],[60,22,94,34],[26,50,54,58],[94,50,66,58]]}];
const thumb=(i,w=130,h=82)=>{const d=TH[i%4];return `<svg width="${w}" height="${h}" viewBox="0 0 120 76" fill="none" stroke="#555" stroke-width="1.4">${d.r.map(a=>`<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" rx="3" fill="#fff"/>`).join('')}${d.l.map(a=>`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}"/>`).join('')}</svg>`};
const fo='<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#555" stroke-width="1.4"><path d="M2 5h5l1.5 2H16v8H2z"/></svg>';
const fi=(n=22)=>`<svg width="${n}" height="${n}" viewBox="0 0 18 18" fill="none" stroke="#555" stroke-width="1.4"><path d="M4 2h7l3 3v11H4z"/><path d="M11 2v3h3"/></svg>`;
const btn=(t,c='')=>`<button class="btn ${c}">${t}</button>`;
const bar=(r='')=>`<div class="bar"><h1>DrawIt</h1><span class="sp"></span>${r}</div>`;
const nav=btn('Import')+btn('Open folder…');
const crumbsHtml=a=>a.map((x,i)=>i==a.length-1?`<b>${x}</b>`:`${x} ›`).join(' ');
const pcard=(n,c,m,t)=>`<div class="card"><div class="th">${thumb(t)}</div><div class="cm"><b>${n}</b><span class="mnu">⋯</span></div><div class="muted small">${c} diagrams · ${m}</div></div>`;
const dcard=(n,m,t,o={})=>`<div class="card">${o.menu?'<div class="menu"><div>Rename</div><div>Move to project…</div><div class="d">Delete</div></div>':''}<div class="th ${o.k||''}">${o.k=='load'?'<span class="muted small">Drawing…</span>':o.k=='bad'?fi()+'<span class="small" style="padding:0 6px;text-align:center">Can\'t open: line 12, column 5</span>':o.k=='big'?fi()+'<span class="small muted">Too large to preview</span>':thumb(t)}</div><div class="cm"><b>${n}</b>${o.nomenu?'':`<span class="mnu ${o.menu?'on':''}">⋯</span>`}</div><div class="muted small">${m}</div></div>`;
const dlg=(t,body,foot,w=420,under='')=>under+`<div class="scrim"><div class="sheet" style="width:${w}px"><div class="hd">${t}</div><div class="bd">${body}</div><div class="ft">${foot}</div></div></div>`;
const home=(under)=>bar(nav)+`<div class="body"><div class="page"><div class="head"><h2>Projects</h2>${btn('New diagram')}${btn('New project','primary')}</div><div class="grid">${pcard('Home network',3,'Today',0)}${pcard('Client pitch',2,'Yesterday',1)}${pcard('Payments platform',7,'Mon',2)}${pcard('Drafts',2,'Today',3)}<div class="card add">+ New project</div></div><h3 class="sec">Recent</h3><div class="grid">${dcard('network','Home network',0,{nomenu:1})}${dcard('checkout-flow','Payments platform',2,{nomenu:1})}${dcard('pitch-arch','Client pitch',1,{nomenu:1})}${dcard('Untitled 2','Drafts',3,{nomenu:1})}</div></div>${under||''}</div>`;

/* editor pieces */
const sv=b=>`<svg width="34" height="26" viewBox="0 0 34 26" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">${b}</svg>`;
const SH={rect:'<rect x="4" y="5" width="26" height="16" rx="1"/>',ellipse:'<ellipse cx="17" cy="13" rx="13" ry="9"/>',rounded:'<rect x="4" y="5" width="26" height="16" rx="6"/>',diamond:'<path d="M17 2l13 11-13 11L4 13z"/>',triangle:'<path d="M17 3l13 20H4z"/>',hexagon:'<path d="M9 3h16l7 10-7 10H9L2 13z"/>',star:'<path d="M17 2l4 8 9 1-6.5 6 2 8.5L17 21l-7.5 4.5 2-8.5L5 11l9-1z"/>',callout:'<path d="M4 4h26v14H16l-5 5v-5H4z"/>',process:'<rect x="3" y="6" width="28" height="14"/><path d="M8 6v14M26 6v14"/>',decision:'<path d="M17 2l14 11-14 11L3 13z"/>',terminator:'<rect x="3" y="6" width="28" height="14" rx="7"/>',data:'<path d="M9 5h22l-6 16H3z"/>',document:'<path d="M4 4h26v15c-5-3-9 3-13 0s-9 3-13 0z"/>',arrow:'<path d="M3 9h16V4l12 9-12 9v-5H3z"/>',server:'<rect x="5" y="3" width="24" height="8" rx="1"/><rect x="5" y="14" width="24" height="8" rx="1"/><circle cx="10" cy="7" r=".8"/><circle cx="10" cy="18" r=".8"/>',database:'<ellipse cx="17" cy="6" rx="10" ry="3.5"/><path d="M7 6v14c0 2 4.5 3.5 10 3.5s10-1.5 10-3.5V6"/><path d="M7 13c0 2 4.5 3.5 10 3.5s10-1.5 10-3.5"/>',cloud:'<path d="M9 21a5 5 0 010-10 7 7 0 0113-2 6 6 0 013 12z"/>',user:'<circle cx="17" cy="8" r="4"/><path d="M8 23c0-6 4-9 9-9s9 3 9 9z"/>',browser:'<rect x="3" y="4" width="28" height="18" rx="2"/><path d="M3 9h28"/><circle cx="7" cy="6.5" r=".7"/>',router:'<rect x="3" y="12" width="28" height="9" rx="2"/><path d="M10 12V6M17 12V4M24 12V6"/>',container:'<rect x="4" y="4" width="26" height="18" stroke-dasharray="4 3"/><rect x="10" y="9" width="14" height="8"/>',select:'<path d="M10 4l14 9-6 1.5L15 21z"/>',line:'<path d="M5 21L29 5"/>',arrowl:'<path d="M5 21L29 5M29 5h-7M29 5v7"/>',text:'<path d="M9 5h16M17 5v17"/>',frame:'<path d="M10 3v20M24 3v20M3 9h28M3 17h28"/>',image:'<rect x="4" y="4" width="26" height="18" rx="2"/><circle cx="11" cy="10" r="2"/><path d="M5 20l7-6 5 4 4-3 8 5"/>'};
const tile=(k,on,tip)=>`<div class="tile ${on?'on':''}">${sv(SH[k])}${tip?`<span class="tip">${tip}</span>`:''}</div>`;
const group=(h,keys)=>`<h4>${h}</h4><div class="tiles">${keys.map(k=>tile(k)).join('')}</div>`;
const UI={undo:'<path d="M7 5L3.5 8.5 7 12M4 8.5h8a4 4 0 010 8h-2"/>',redo:'<path d="M13 5l3.5 3.5L13 12M16 8.5H8a4 4 0 000 8h2"/>',home:'<path d="M3.5 9L10 3.5 16.5 9M5.5 8v8h9V8"/>'};
const ic=n=>`<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${UI[n]}</svg>`;
const T=n=>`<span class="t">${ic(n)}</span>`;
const lib=`<div class="lib"><div class="in"><input placeholder="Search shapes"><h4>Tools</h4><div class="tiles">${tile('select',1,'Select')}${tile('line')}${tile('arrowl')}${tile('text')}${tile('frame')}${tile('image')}</div>${group('Basic',['rect','ellipse','rounded','diamond','triangle','hexagon','star','callout'])}${group('Flowchart',['process','decision','terminator','data','document','arrow'])}${group('Architecture',['server','database','cloud','user','browser','router','container'])}</div></div>`;
const sty=`<div class="sty"><div class="in"><div class="f1"><i>Fill</i><b>none</b></div><div class="f1"><i>Stroke</i><b>#1a1a1a</b></div><div class="f1"><i>Width</i><b>1.5</b></div><div class="f1"><i>Opacity</i><b>1</b></div></div></div>`;
const filePill=(state)=>`<div class="pill" style="right:12px;top:12px"><span class="t">${ic('home')}</span><b class="txt" style="font-weight:600">network</b><span class="muted small">Home network</span><span class="txt small muted">${state}</span><span class="sep"></span>${T('undo')}${T('redo')}<span class="sep"></span><button class="btn" style="margin:0 3px">Export</button></div>`;
const status=`<div class="pill" style="left:12px;bottom:12px"><span class="t" style="width:24px">−</span><span class="txt small" style="padding:0 2px">100%</span><span class="t" style="width:24px">+</span><span class="sep"></span><span class="txt small muted">412, 188</span><span class="sep"></span><span class="txt small"><span class="chk on"></span>Grid</span><span class="txt small"><span class="chk on"></span>Snap</span></div>`;
const diagram=`<svg class="d" width="100%" height="100%" viewBox="0 0 700 520" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#1a1a1a" stroke-width="1.5"><rect x="120" y="150" width="140" height="64" rx="6" fill="#fff"/><rect x="380" y="120" width="140" height="64" rx="6" fill="#fff"/><rect x="260" y="300" width="140" height="64" rx="6" fill="#fff"/><line x1="260" y1="182" x2="380" y2="152"/><line x1="330" y1="300" x2="440" y2="184"/><text x="160" y="187" font-size="14" fill="#1a1a1a" stroke="none">Router</text><text x="420" y="157" font-size="14" fill="#1a1a1a" stroke="none">Switch</text><text x="300" y="337" font-size="14" fill="#1a1a1a" stroke="none">NAS</text></svg>`;
const editor=(o={})=>[(o.noPanels?'':lib),`<div class="cv">${diagram}${filePill(o.state||'✓ Saved')}${status}${o.extra||''}</div>`,(o.noPanels?'':sty)].join('');

/* groups: [label, [ [name, note, render, editor?] ]] */
const G=[
 ['Home',[
  ['First run','Nothing exists yet. The four ways in are offered and the screen says where files live (E52). No empty grid.',()=>bar(nav)+`<div class="body"><div class="center"><h2>Draw your first diagram</h2><div class="muted">Your projects are saved in <b>~/DrawIt</b> as plain text files.</div><div class="acts">${btn('New diagram','primary')}${btn('New project')}${btn('Open folder…')}${btn('Import a file')}</div></div></div>`],
  ['Projects','Start screen. One card per project, showing its most recently changed diagram (E57). Recent diagrams below. The card menu offers rename and delete (E54, E59).',()=>home()],
  ['Project','Landing page of a project. First card: menu open. Second: still drawing. Fourth: a file that does not parse, with its position on hover (E58). Fifth: too large to preview.',()=>bar(nav)+`<div class="body"><div class="page"><div class="head"><span class="muted">‹ Projects</span><h2 style="margin-left:8px">Home network</h2>${btn('Rename')}${btn('Import here')}${btn('New diagram','primary')}</div><div class="grid">${dcard('network','Today 10:42',0,{menu:1})}${dcard('vlans','Yesterday',1,{k:'load'})}${dcard('wifi-plan','Mon',2)}${dcard('broken','Mon',2,{k:'bad'})}${dcard('rack-photo-wall','Last week',3,{k:'big'})}<div class="card add">+ New diagram</div></div></div></div>`],
  ['Opened folder','A folder outside the library, such as a repo. Same cards; a path header and a tag; no card menus, since rename and delete are left to the operating system (E54). Only the top level is listed (E45). Recent files are those of this folder (E46).',()=>bar(nav)+`<div class="body"><div class="page"><div class="head"><span class="muted">‹ Home</span><h2 style="margin-left:8px">docs</h2><span class="tag">Opened folder</span><span class="muted small" style="margin-left:6px">~/Documents/repos/my-app/docs</span><span class="sp"></span>${btn('Open folder…')}${btn('New diagram','primary')}</div><div class="grid">${dcard('architecture','Today',3,{nomenu:1})}${dcard('deploy','Yesterday',1,{nomenu:1})}${dcard('data-flow','Mon',0,{nomenu:1})}<div class="card add">+ New diagram</div></div><h3 class="sec">Recent in this folder</h3><div class="grid">${dcard('architecture','Today',3,{nomenu:1})}${dcard('deploy','Yesterday',1,{nomenu:1})}</div></div></div>`],
  ['Drafts','New diagrams start in the Drafts project (E53). Its card menu adds Move to project. Autosave is on in the library (E51).',()=>bar(nav)+`<div class="body"><div class="page"><div class="head"><span class="muted">‹ Projects</span><h2 style="margin-left:8px">Drafts</h2><span class="tag">Autosaved</span><span class="sp"></span>${btn('New diagram','primary')}</div><div class="grid">${dcard('Untitled 2','Today 11:05',3,{menu:1})}${dcard('Untitled','Today 09:12',1)}<div class="card add">+ New diagram</div></div></div></div>`]
 ]],
 ['Dialogs',[
  ['New project','Names use letters, numbers, spaces, hyphens and underscores. A name that exists, ignoring case, is refused.',()=>dlg('New project',`<input class="f bad" value="home Network"><div class="err">A project named "Home network" already exists.</div>`,`<span class="sp"></span>${btn('Cancel')}<button class="btn primary" disabled>Create</button>`,420,home())],
  ['Delete','The confirmation names what goes and where it goes. The item moves to the operating system\'s trash (E54).',()=>dlg('Delete "Client pitch"?',`<div>This project and its 2 diagrams move to the Trash.</div>`,`<span class="sp"></span>${btn('Cancel')}${btn('Move to Trash','danger')}`,420,home())],
  ['Delete, no trash','Where there is no trash, the second confirmation says the delete is permanent.',()=>dlg('Delete "Client pitch" permanently?',`<div>This cannot be undone. The project and its 2 diagrams will be removed from the disk.</div>`,`<span class="sp"></span>${btn('Cancel')}${btn('Delete permanently','danger')}`,420,home())],
  ['Import','Choose a file from the computer; it is copied into the chosen project (E55).',()=>dlg('Import a diagram',`<div class="drop">Drop a .drawit.kdl file here<br><span class="small">or</span><br>${btn('Choose file…')}</div><div><span class="small muted">Into project</span><br><select class="f"><option>Home network</option></select></div>`,`<span class="sp"></span>${btn('Cancel')}<button class="btn primary" disabled>Import</button>`,460,home())],
  ['Import refused','A file that fails to parse is refused with its line and column.',()=>dlg('Import a diagram',`<div class="drop" style="border-color:#b00020">pitch.drawit.kdl</div><div class="err">Can't import: line 12, column 5: unexpected end of node.</div>`,`<span class="sp"></span>${btn('Cancel')}<button class="btn primary" disabled>Import</button>`,460,home())],

const flat=[];G.forEach((g,gi)=>g[1].forEach((s,si)=>flat.push({g:gi,s:si,d:s})));
let i=Math.min(flat.length-1,Math.max(0,+(location.hash.slice(1)||0)));
function draw(){
 const ctl=document.getElementById('ctl');let n=0;
 ctl.innerHTML=G.map(g=>`<div class="g"><span class="lab">${g[0]}</span>${g[1].map(s=>{const k=n++;return `<button aria-pressed="${k==i}" data-i="${k}">${s[0]}</button>`}).join('')}</div>`).join('');
 const d=flat[i].d;
 document.getElementById('note').innerHTML='<b>'+d[0]+'.</b> '+d[1];
 const w=document.getElementById('win');w.className='win'+(d[3]?' ed':'');w.innerHTML=d[2]();
 try{history.replaceState(null,'','#'+i)}catch(e){}
}
document.addEventListener('click',e=>{const b=e.target.closest('.ctl button');if(b){i=+b.dataset.i;draw()}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&i<flat.length-1){i++;draw()}if(e.key==='ArrowLeft'&&i>0){i--;draw()}});
draw();
</script></body></html>
